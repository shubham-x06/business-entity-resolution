# ------------------------------------------------------------------
# blocking.yaml  –  Candidate-generation / blocking configuration
# ------------------------------------------------------------------

minhash_lsh:
  num_perm: 128           # Number of MinHash permutation functions
  threshold: 0.3          # Jaccard similarity threshold for LSH
  ngram_size: 3           # Character n-gram size for shingling

name_blocking:
  enabled: true
  prefix_len: 4           # First-N-chars exact-match blocking key

country_blocking:
  enabled: true           # Only pair records from the same country

address_blocking:
  enabled: true           # Token-overlap address blocking
  min_token_len: 3        # Min token length to be considered significant
  max_token_freq: 5000    # Tokens appearing in more records than this are pruned
  min_shared_tokens: 1    # Minimum shared address tokens for a candidate pair

candidate_ranking:
  enabled: true
  max_candidates_per_entity: 200  # Final K chosen for candidate-set size efficiency and throughput
  hard_cap_name_token_freq: 10000 # Optimal name token cap: clears >100 q/s throughput with 92.4% recall
  hard_cap_addr_token_freq: 5000  # Address tokens: kept tight at 5k
  hard_cap_bigram_freq: 5000      # Address bigrams: kept tight at 5k
