# ------------------------------------------------------------------
# model.yaml  –  LightGBM classifier & threshold settings
# ------------------------------------------------------------------

lgbm:
  boosting_type: "gbdt"
  num_leaves: 63
  max_depth: -1
  learning_rate: 0.05
  n_estimators: 500
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  random_state: 42
  n_jobs: -1
  class_weight: "balanced"

threshold:
  match: 0.5              # Probability threshold for declaring a match

validation:
  test_size: 0.2
  random_state: 42
